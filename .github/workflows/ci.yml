name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ruff + pytest (${{ matrix.os }}, py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --group dev --python ${{ matrix.python-version }}
      - run: uv run ruff check .
      - run: uv run pytest -q

  hooks:
    name: hook selftests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python hooks/cad_simplify_nudge.py --selftest
      - run: python hooks/dfam_guard.py --selftest
      - run: python hooks/fusion_kit_brief_guard.py --selftest
      - run: python hooks/fusion_kit_nudge.py --selftest
